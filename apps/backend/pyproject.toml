[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "drishti-registry-api"
version = "0.1.0"
description = "Drishti AI camera registry and GIS API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "groq>=0.31,<1",
  "httpx>=0.27,<1",
  "imageio-ffmpeg>=0.5,<1",
  "pillow>=10,<13",
  "psutil>=6,<8",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
analytics = [
  "google-cloud-vision>=3.10,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "ultralytics>=8,<9",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
