name: drishti-p03

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drishti_registry}
      POSTGRES_USER: ${POSTGRES_USER:-drishti_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}
    volumes:
      - drishti_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - drishti_platform

  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Drishti AI Federation Control Plane}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-drishti_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}@postgres:5432/${POSTGRES_DB:-drishti_registry}
      AUTO_CREATE_SCHEMA: "false"
      DB_ECHO: ${DB_ECHO:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      FEDERATION_ENCRYPTION_KEY: ${FEDERATION_ENCRYPTION_KEY:?Generate and securely inject FEDERATION_ENCRYPTION_KEY before starting Compose}
      FEDERATION_ENCRYPTION_KEY_ID: ${FEDERATION_ENCRYPTION_KEY_ID:-local-development-key-v1}
      FEDERATION_ALLOWED_CIDRS: ${FEDERATION_ALLOWED_CIDRS:-}
      FEDERATION_PROBE_TIMEOUT_SECONDS: ${FEDERATION_PROBE_TIMEOUT_SECONDS:-5}
      FEDERATION_MEDIA_ROOT: /workspace/runtime/media
      FFMPEG_BINARY: ${FFMPEG_BINARY:-/usr/bin/ffmpeg}
      FEDERATION_RUNTIME_ROOT: /workspace/runtime/streams
      FEDERATION_RUNTIME_SEGMENT_SECONDS: ${FEDERATION_RUNTIME_SEGMENT_SECONDS:-2}
      FEDERATION_RUNTIME_PLAYLIST_WINDOW: ${FEDERATION_RUNTIME_PLAYLIST_WINDOW:-6}
      FEDERATION_RUNTIME_WATCHDOG_SECONDS: ${FEDERATION_RUNTIME_WATCHDOG_SECONDS:-12}
      FEDERATION_RUNTIME_MAX_BACKOFF_SECONDS: ${FEDERATION_RUNTIME_MAX_BACKOFF_SECONDS:-30}
      FEDERATION_RUNTIME_MAX_RESTARTS: ${FEDERATION_RUNTIME_MAX_RESTARTS:-8}
      FEDERATION_RUNTIME_STOP_TIMEOUT_SECONDS: ${FEDERATION_RUNTIME_STOP_TIMEOUT_SECONDS:-5}
      FEDERATION_RUNTIME_MAX_ACTIVE_SESSIONS: ${FEDERATION_RUNTIME_MAX_ACTIVE_SESSIONS:-8}
      STREAM_ENGINE_DECODER_BACKEND: ${STREAM_ENGINE_DECODER_BACKEND:-auto}
      STREAM_ENGINE_RTSP_TRANSPORT: ${STREAM_ENGINE_RTSP_TRANSPORT:-tcp}
      STREAM_ENGINE_OUTPUT_WIDTH: ${STREAM_ENGINE_OUTPUT_WIDTH:-640}
      STREAM_ENGINE_OUTPUT_HEIGHT: ${STREAM_ENGINE_OUTPUT_HEIGHT:-360}
      STREAM_ENGINE_DECODE_FPS: ${STREAM_ENGINE_DECODE_FPS:-12}
      STREAM_ENGINE_TARGET_FPS: ${STREAM_ENGINE_TARGET_FPS:-10}
      STREAM_ENGINE_BUFFER_SIZE: ${STREAM_ENGINE_BUFFER_SIZE:-2}
      STREAM_ENGINE_MAX_FRAME_AGE_MS: ${STREAM_ENGINE_MAX_FRAME_AGE_MS:-750}
      STREAM_ENGINE_BATCH_SIZE: ${STREAM_ENGINE_BATCH_SIZE:-8}
      STREAM_ENGINE_BATCH_TIMEOUT_MS: ${STREAM_ENGINE_BATCH_TIMEOUT_MS:-40}
      STREAM_ENGINE_HEALTH_TIMEOUT_SECONDS: ${STREAM_ENGINE_HEALTH_TIMEOUT_SECONDS:-5}
      STREAM_ENGINE_FREEZE_THRESHOLD_SECONDS: ${STREAM_ENGINE_FREEZE_THRESHOLD_SECONDS:-10}
      STREAM_ENGINE_MAX_BACKOFF_SECONDS: ${STREAM_ENGINE_MAX_BACKOFF_SECONDS:-30}
      STREAM_ENGINE_STOP_TIMEOUT_SECONDS: ${STREAM_ENGINE_STOP_TIMEOUT_SECONDS:-5}
      STREAM_ENGINE_MAX_ACTIVE_SESSIONS: ${STREAM_ENGINE_MAX_ACTIVE_SESSIONS:-32}
      STREAM_ENGINE_PREVIEW_FPS: ${STREAM_ENGINE_PREVIEW_FPS:-2}
      AI_SHOWCASE_DATABASE: /workspace/runtime/ai/crops.db
      LIVE_ANALYTICS_ENABLED: ${LIVE_ANALYTICS_ENABLED:-true}
      LIVE_ANALYTICS_GENERAL_MODEL: /workspace/AI-Features/models/yolo26n.pt
      LIVE_ANALYTICS_PLATE_MODEL: /workspace/AI-Features/models/license_plate_detector.pt
      LIVE_ANALYTICS_OCR_ENABLED: ${LIVE_ANALYTICS_OCR_ENABLED:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.6-27b}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      VISUAL_INTELLIGENCE_ENABLED: ${VISUAL_INTELLIGENCE_ENABLED:-true}
      VISUAL_INTELLIGENCE_AUTO_ANALYZE: ${VISUAL_INTELLIGENCE_AUTO_ANALYZE:-true}
    command:
      - /bin/sh
      - -ec
      - >-
        cd apps/backend &&
        python -m alembic upgrade head &&
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    volumes:
      - ../../runtime/media:/workspace/runtime/media:ro
      - drishti_runtime_streams:/workspace/runtime/streams
      - drishti_ai_evidence:/workspace/runtime/ai
      - ../../secrets:/workspace/secrets:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json,sys,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)); sys.exit(0 if data.get('status') == 'ready' else 1)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - drishti_platform

  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_MAP_TILE_URL: "${VITE_MAP_TILE_URL:-}"
        VITE_MAP_ATTRIBUTION: "${VITE_MAP_ATTRIBUTION:-}"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - drishti_platform

volumes:
  drishti_postgres_data:
  drishti_runtime_streams:
  drishti_ai_evidence:

networks:
  drishti_platform:
    driver: bridge
