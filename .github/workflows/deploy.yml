name: Drishti AI CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: drishti-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI - Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate backend Python
        run: |
          python3 -m compileall -q apps/backend

      - name: Validate Docker Compose
        run: |
          docker compose \
            -f deployment/docker/compose.p0.3.yml \
            -f deployment/docker/compose.gpu.yml \
            -f deployment/docker/compose.https.yml \
            config -q

      - name: Build backend image
        run: |
          docker build \
            -f deployment/docker/backend.Dockerfile \
            -t drishti-ai-backend-ci .

      - name: Build frontend image
        run: |
          docker build \
            -f deployment/docker/frontend.Dockerfile \
            -t drishti-ai-frontend-ci .

  deploy:
    name: CD - Deploy to GCP VM
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/drishti_deploy_key
          chmod 600 ~/.ssh/drishti_deploy_key
          ssh-keygen -y -f ~/.ssh/drishti_deploy_key > /dev/null

      - name: Deploy Drishti AI
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          DEPLOY_HOST_CLEAN="$(printf '%s' "$DEPLOY_HOST" | tr -d '\r\n')"
          DEPLOY_USER_CLEAN="$(printf '%s' "$DEPLOY_USER" | tr -d '\r\n')"

          ssh \
            -i ~/.ssh/drishti_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER_CLEAN@$DEPLOY_HOST_CLEAN" \
            'bash -se' <<'REMOTE'
              set -Eeuo pipefail

              cd ~/Drashti-AI

              echo "=== Synchronizing repository ==="
              git fetch origin main
              git reset --hard origin/main
              git lfs pull

              echo "=== Validating source ==="
              python3 -m compileall -q apps/backend

              echo "=== Validating Compose ==="
              docker compose --env-file .env \
                -f deployment/docker/compose.p0.3.yml \
                -f deployment/docker/compose.gpu.yml \
                -f deployment/docker/compose.https.yml \
                config -q

              echo "=== Building and starting services ==="
              docker compose --env-file .env \
                -f deployment/docker/compose.p0.3.yml \
                -f deployment/docker/compose.gpu.yml \
                -f deployment/docker/compose.https.yml \
                up -d --build --remove-orphans

              echo "=== Waiting for backend ==="
              for i in $(seq 1 30); do
                if docker compose --env-file .env \
                  -f deployment/docker/compose.p0.3.yml \
                  -f deployment/docker/compose.gpu.yml \
                  -f deployment/docker/compose.https.yml \
                  ps --status running backend | grep -q backend; then
                  echo "Backend container is running."
                  break
                fi

                if [ "$i" -eq 30 ]; then
                  echo "Backend failed to start."
                  docker compose --env-file .env \
                    -f deployment/docker/compose.p0.3.yml \
                    -f deployment/docker/compose.gpu.yml \
                    -f deployment/docker/compose.https.yml \
                    ps
                  docker compose --env-file .env \
                    -f deployment/docker/compose.p0.3.yml \
                    -f deployment/docker/compose.gpu.yml \
                    -f deployment/docker/compose.https.yml \
                    logs --tail=100 backend
                  exit 1
                fi

                sleep 2
              done

              echo "=== Checking backend health ==="
              for i in $(seq 1 30); do
                if curl --fail --silent http://127.0.0.1:8000/health/ready > /dev/null; then
                  echo "Backend health check passed."
                  break
                fi

                if [ "$i" -eq 30 ]; then
                  echo "Backend health check failed."
                  docker compose --env-file .env \
                    -f deployment/docker/compose.p0.3.yml \
                    -f deployment/docker/compose.gpu.yml \
                    -f deployment/docker/compose.https.yml \
                    logs --tail=100 backend
                  exit 1
                fi

                sleep 2
              done

              echo "=== Checking all services ==="
              docker compose --env-file .env \
                -f deployment/docker/compose.p0.3.yml \
                -f deployment/docker/compose.gpu.yml \
                -f deployment/docker/compose.https.yml \
                ps

              echo "=== Checking application ==="
              curl --fail --silent \
                https://drashti-ai.devs.surf/api/v1/health > /dev/null

              echo "=== Deployment successful ==="
          REMOTE
