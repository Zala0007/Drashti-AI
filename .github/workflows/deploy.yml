name: Drishti AI CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: CI - Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -f deployment/docker/backend.Dockerfile \
            -t drishti-ai-backend-ci .

      - name: Build frontend image
        run: |
          docker build \
            -f deployment/docker/frontend.Dockerfile \
            -t drishti-ai-frontend-ci .

  deploy:
    name: CD - Deploy to GCP VM
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          python - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["DEPLOY_SSH_KEY"].replace("\r", "")
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          if not key.endswith("\n"):
              key += "\n"
          Path.home().joinpath(".ssh", "drishti_deploy_key").write_text(key)
          PY
          chmod 600 ~/.ssh/drishti_deploy_key
          ssh-keygen -y -f ~/.ssh/drishti_deploy_key > /dev/null
          touch ~/.ssh/known_hosts

      - name: Deploy Drishti AI
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          DEPLOY_HOST_CLEAN="$(printf '%s' "$DEPLOY_HOST" | tr -d '\r\n')"
          DEPLOY_USER_CLEAN="$(printf '%s' "$DEPLOY_USER" | tr -d '\r\n')"

          ssh \
            -i ~/.ssh/drishti_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER_CLEAN@$DEPLOY_HOST_CLEAN" \
            'bash -se' <<'REMOTE'
              set -e

              cd ~/Drashti-AI

              echo "Pulling latest code..."
              git pull --ff-only origin main

              echo "Building and starting services..."
              docker compose --env-file .env \
                -f deployment/docker/compose.p0.3.yml \
                -f deployment/docker/compose.gpu.yml \
                -f deployment/docker/compose.https.yml \
                up -d --build

              echo "Waiting for services..."
              sleep 15

              echo "Checking service health..."
              docker compose --env-file .env \
                -f deployment/docker/compose.p0.3.yml \
                -f deployment/docker/compose.gpu.yml \
                -f deployment/docker/compose.https.yml \
                ps

              echo "Checking application..."
              curl --fail --silent \
                http://127.0.0.1:80/api/v1/health > /dev/null

              echo "Deployment successful."
          REMOTE
